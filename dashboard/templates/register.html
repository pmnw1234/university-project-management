<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | UPMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xl max-w-md w-full">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-1">Create an Account</h2>
        <p class="text-xs text-slate-400 text-center mb-6">University Project Management System</p>

        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">I am a...</label>
                <select id="roleSelect" name="role" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
                    <option value="student">Student</option>
                    <option value="supervisor">Supervisor</option>
                </select>
            </div>

            <div id="studentIdField">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Student ID</label>
                <input type="text" id="student_id_input" name="student_id" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
                <span class="text-[11px] text-rose-500">{{ form.student_id.errors }}</span>
            </div>

            <div id="staffIdField" class="hidden">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Staff ID</label>
                <input type="text" id="staff_id_input" name="staff_id" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
                <span class="text-[11px] text-rose-500">{{ form.staff_id.errors }}</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
                <span class="text-[11px] text-rose-500">{{ form.confirm_password.errors }}</span>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition mt-2 shadow-md">Register</button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Log In</a></p>
    </div>

    <script>
        const roleSelect = document.getElementById('roleSelect');
        const studentIdField = document.getElementById('studentIdField');
        const studentIdInput = document.getElementById('student_id_input');
        const staffIdField = document.getElementById('staffIdField');
        const staffIdInput = document.getElementById('staff_id_input');

        roleSelect.addEventListener('change', function() {
            if (this.value === 'supervisor') {
                // Hide Student Field & clear values
                studentIdField.classList.add('hidden');
                studentIdInput.removeAttribute('required');
                studentIdInput.value = '';
                
                // Show Staff Field
                staffIdField.classList.remove('hidden');
                staffIdInput.setAttribute('required', 'required');
            } else {
                // Show Student Field
                studentIdField.classList.remove('hidden');
                studentIdInput.setAttribute('required', 'required');
                
                // Hide Staff Field & clear values
                staffIdField.classList.add('hidden');
                staffIdInput.removeAttribute('required');
                staffIdInput.value = '';
            }
        });
    </script>
</body>
</html>
