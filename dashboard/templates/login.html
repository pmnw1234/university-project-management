<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In | UPMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xl max-w-md w-full">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-1">Welcome Back</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Sign in to your UPMS account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-amber-50 text-amber-700 p-3 rounded-xl text-xs font-semibold mb-4">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition mt-2 shadow-md">Sign In</button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
    </div>
</body>
</html>
