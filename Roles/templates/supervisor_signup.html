{% extends "base.html" %}

{% block title %}
Supervisor Registration
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto py-10">

    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8">

        <h2 class="text-2xl font-bold mb-6">
            Supervisor Registration
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg">

                Submit Registration

            </button>

        </form>

    </div>

</div>

{% endblock %}
