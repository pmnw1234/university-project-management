<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}UPMS - Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex">

  <!-- Shared Admin Sidebar -->
  <aside class="w-64 bg-[#1b2234] text-slate-300 flex flex-col min-h-screen p-4 flex-shrink-0">
    <div class="px-3 py-2 mb-6">
      <h1 class="text-white text-xl font-bold tracking-tight">UPMS</h1>
      <p class="text-slate-400 text-xs mt-0.5">University Project Management</p>
    </div>

    <nav class="space-y-1.5 text-sm font-medium">
      <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-[#2c374e] text-white{% else %}text-slate-300 hover:bg-[#2c374e]/60 hover:text-white{% endif %} transition">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span>Dashboard</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span>Users</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="folder" class="w-4 h-4"></i>
        <span>Projects</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="building-2" class="w-4 h-4"></i>
        <span>Departments</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="user-check" class="w-4 h-4"></i>
        <span>Supervisors</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
        <span>Reports</span>
      </a>

      <a href="{% url 'system_logs' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'system_logs' %}bg-[#2c374e] text-white{% else %}text-slate-300 hover:bg-[#2c374e]/60 hover:text-white{% endif %} transition">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
        <span>System Logs</span>
      </a>

      <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-300 hover:bg-[#2c374e]/60 hover:text-white transition">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="flex-1 p-8 space-y-6 overflow-y-auto">

    <!-- Top Header -->
    <header class="flex items-center justify-between pb-2">
      <h1 class="text-xl font-bold tracking-tight text-slate-900 uppercase">{% block header_title %}ADMIN DASHBOARD{% endblock %}</h1>
      <div class="flex items-center space-x-4">
        <button class="relative p-2 text-slate-400 hover:text-slate-600">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>
        <div class="flex items-center space-x-2">
          <div class="w-9 h-9 bg-teal-600 rounded-full flex items-center justify-center text-white font-bold text-xs">A</div>
          <span class="text-xs text-slate-400 font-medium">Administrator</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
        </div>
      </div>
    </header>

    <!-- Page Body Content -->
    {% block content %}
    {% endblock %}

  </main>

  <script>
    lucide.createIcons();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
